services:
  - type: web
    name: trotamundos-web
    runtime: static
    buildCommand: npm install --legacy-peer-deps && npx expo export --platform web
    staticPublishPath: dist
    envVars:
      - key: EXPO_PUBLIC_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
